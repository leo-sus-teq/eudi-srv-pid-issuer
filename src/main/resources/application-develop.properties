spring.web.error.include-stacktrace=always

#
# Issuer options
#
issuer.publicUrl=http://localhost:8080
issuer.authorizationServer.publicUrl=https://localhost/idp/realms/pid-issuer-realm
issuer.authorizationServer.introspection=${issuer.authorizationServer.publicUrl}/protocol/openid-connect/token/introspect

issuer.keystore.file=classpath:issuer-keys.jks
issuer.keystore.type=JKS
issuer.keystore.password=keys

issuer.credentialRequestEncryption.jwks.alias=request-encryption
issuer.credentialRequestEncryption.jwks.password=request-encryption

issuer.nonce.encryption-key.alias=nonce-encryption
issuer.nonce.encryption-key.password=nonce-encryption

issuer.pid.mso_mdoc.signing-key.alias=issuance
issuer.pid.mso_mdoc.signing-key.password=issuance
issuer.pid.sd_jwt_vc.signing-key.alias=issuance
issuer.pid.sd_jwt_vc.signing-key.password=issuance

issuer.mdl.signing-key.alias=issuance
issuer.mdl.signing-key.password=issuance

issuer.learningCredential.signing-key.alias=issuance
issuer.learningCredential.signing-key.password=issuance

issuer.ehic.signing-key.alias=issuance
issuer.ehic.signing-key.password=issuance

issuer.residencePermit.signing-key.alias=issuance
issuer.residencePermit.signing-key.password=issuance

issuer.schufa.sd_jwt_vc.signing-key.alias=issuance
issuer.schufa.sd_jwt_vc.signing-key.password=issuance
issuer.schufa.mso_mdoc.signing-key.alias=issuance
issuer.schufa.mso_mdoc.signing-key.password=issuance

issuer.arbeitsvertrag.sd_jwt_vc.signing-key.alias=issuance
issuer.arbeitsvertrag.sd_jwt_vc.signing-key.password=issuance
issuer.arbeitsvertrag.mso_mdoc.signing-key.alias=issuance
issuer.arbeitsvertrag.mso_mdoc.signing-key.password=issuance

issuer.dpop.realm=pid-issuer

issuer.access-certificate.alias=access-certificate
issuer.access-certificate.password=access-certificate

issuer.metadata.display[0].name=TRUSTEQ - EUDI Demo Wallet
issuer.metadata.display[0].locale=en
issuer.metadata.display[0].logo.uri=${issuer.publicUrl}/public/img/trusteq-logo.png
issuer.metadata.display[0].logo.alternative-text=TRUSTEQ - EUDI Demo Wallet Logo

issuer.statusList.service.generate-uri=https://localhost/token_status_list/take
issuer.statusList.service.revoke-uri=https://localhost/token_status_list/set
issuer.statusList.service.apiKey=aaa-bbb-ccc

